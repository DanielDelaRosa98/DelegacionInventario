<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login - Inventarios Bienestar BCS</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .login-screen {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }
    /* Mitad superior azul */
    .login-top {
      min-height: 46vh;
      background: #1a5596;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 56px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .login-brand img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
    }
    .login-brand h1 {
      margin: 0;
      color: #ffffff;
      font-size: 44px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.5px;
    }
    /* Mitad inferior blanca con curva superior */
    .login-bottom {
      flex: 1;
      background: #ffffff;
      border-radius: 40px 40px 0 0;
      margin-top: -40px;
      box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      justify-content: center;
      padding: 42px 24px 24px;
    }
    .login-box {
      width: 100%;
      max-width: 520px;
    }
    .login-title {
      color: #153e70;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 28px 0;
    }
    .login-field {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
    }
    .login-icon {
      color: #1a5596;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }
    .login-input-wrap {
      flex: 1;
      border-bottom: 1.5px solid #c8d0da;
      padding-bottom: 6px;
      display: flex;
      align-items: center;
      transition: border-color 0.2s ease;
    }
    .login-input-wrap:focus-within {
      border-bottom-color: #1a5596;
    }
    .login-input-wrap input {
      width: 100%;
      border: none;
      background: transparent;
      color: #334155;
      font-size: 16px;
      padding: 4px 0;
      outline: none;
    }
    .login-input-wrap input::placeholder {
      color: #8b95a5;
    }
    .btn-eye {
      background: transparent;
      border: none;
      color: #1a5596;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-eye:hover {
      color: #0f3868;
    }
    .login-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 32px;
      padding-left: 44px;
    }
    .login-remember {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #8b95a5;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
    }
    .login-remember input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #1a5596;
      cursor: pointer;
    }
    .btn-submit {
      background: #1a5596;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 10px 48px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn-submit:hover {
      background: #134277;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    #login-msg {
      margin-top: 16px;
      padding-left: 44px;
      font-size: 13px;
      min-height: 20px;
      color: #dc2626;
    }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .login-top {
        min-height: 36vh;
        padding: 24px 16px 48px;
      }
      .login-brand {
        gap: 12px;
      }
      .login-brand img {
        width: 68px;
        height: 68px;
      }
      .login-brand h1 {
        font-size: 30px;
      }
      .login-bottom {
        border-radius: 28px 28px 0 0;
        margin-top: -28px;
        padding: 32px 20px 24px;
      }
      .login-actions {
        padding-left: 0;
        flex-wrap: wrap;
        gap: 16px;
      }
      .btn-submit {
        width: 100%;
        padding: 12px 24px;
        text-align: center;
      }
      #login-msg {
        padding-left: 0;
      }
    }
  </style>
</head>
<body>

  <div class="login-screen">
    <!-- Mitad superior azul -->
    <div class="login-top">
      <div class="login-brand">
        <img src="/logo.png" alt="Logo Inventarios" onerror="this.style.display='none'">
        <h1>Inventarios</h1>
      </div>
    </div>

    <!-- Mitad inferior blanca -->
    <div class="login-bottom">
      <div class="login-box">
        <h2 class="login-title">Login</h2>

        <form id="login-form">
          <!-- Usuario -->
          <div class="login-field">
            <svg class="login-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <circle cx="8" cy="10" r="2"/>
              <path d="M14 9h4"/>
              <path d="M14 13h4"/>
              <path d="M5 16c.8-1.4 2-2 3-2s2.2.6 3 2"/>
            </svg>
            <div class="login-input-wrap">
              <input id="user" type="text" placeholder="Usuario" autocomplete="username" required>
            </div>
          </div>

          <!-- Contraseña -->
          <div class="login-field">
            <svg class="login-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              <circle cx="12" cy="16" r="1"/>
            </svg>
            <div class="login-input-wrap">
              <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
              <button type="button" id="btn-toggle-pass" class="btn-eye" title="Mostrar u ocultar contraseña">
                <svg id="eye-off" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
                <svg id="eye-on" class="hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Guardar clave y Botón -->
          <div class="login-actions">
            <label class="login-remember">
              <input type="checkbox" id="remember-user">
              <span>Guardar clave</span>
            </label>
            <button id="btn-login" class="btn-submit" type="submit">Ingresar</button>
          </div>

          <div id="login-msg"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      // Si el usuario ya tiene sesión activa, enviarlo directo al sistema
      try {
        const check = await fetch('/api/auth/me', { credentials: 'include' });
        if (check.ok) {
          window.location.replace('dashboard.html');
          return;
        }
      } catch {}

      const userInput = document.getElementById('user');
      const passInput = document.getElementById('pass');
      const rememberChk = document.getElementById('remember-user');
      const toggleBtn = document.getElementById('btn-toggle-pass');
      const eyeOff = document.getElementById('eye-off');
      const eyeOn = document.getElementById('eye-on');
      const form = document.getElementById('login-form');
      const msg = document.getElementById('login-msg');
      const btnLogin = document.getElementById('btn-login');

      // Recuperar usuario guardado
      const savedUser = localStorage.getItem('inv_saved_user');
      if (savedUser) {
        userInput.value = savedUser;
        rememberChk.checked = true;
      }

      // Mostrar / Ocultar contraseña
      toggleBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        eyeOff.classList.toggle('hidden', isPass);
        eyeOn.classList.toggle('hidden', !isPass);
      });

      // Enviar formulario a la API
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = userInput.value.trim();
        const password = passInput.value;

        msg.style.color = '#1a5596';
        msg.textContent = 'Validando...';
        btnLogin.disabled = true;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || !data.ok) {
            throw new Error(data.error || data.message || 'Usuario o contraseña inválidos');
          }

          if (rememberChk.checked) {
            localStorage.setItem('inv_saved_user', username);
          } else {
            localStorage.removeItem('inv_saved_user');
          }

          window.location.replace('dashboard.html');
        } catch (err) {
          msg.style.color = '#dc2626';
          msg.textContent = err.message || 'No se pudo iniciar sesión';
          btnLogin.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
